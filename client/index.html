<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <meta name="description" content="LUM RSS Explorer - Global World News Feed aggregator from BBC, CNN, CNBC, NDTV, NYT, Google News, and more.">
    <title>LUM RSS Explorer - Global World News Feed</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      (function() {
        var theme;
        try { theme = localStorage.getItem('lum-news-theme'); } catch (_) {}
        if (!theme) {
          theme = typeof window.matchMedia === 'function' && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <main id="app-startup" style="box-sizing:border-box;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:#020b0e;color:#fff;font-family:Arial,sans-serif;text-align:center">
        <h1 style="font-size:40px;font-weight:400;margin:0 0 16px">LUM News</h1>
        <p role="status">Loading your news…</p>
        <a href="/" style="color:#79d9ff;margin-top:16px">Reload page</a>
        <noscript><p>Enable JavaScript to use LUM News.</p></noscript>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
